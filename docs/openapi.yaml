openapi: 3.1.0
info:
  title: Personal AI OS API
  version: 0.1.0
  description: Local-first Personal AI OS core API.
servers:
  - url: http://localhost:8080
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      security: []
      summary: Liveness probe
      responses:
        '200':
          description: Process is alive
  /ready:
    get:
      security: []
      summary: Readiness probe
      responses:
        '200':
          description: Database is ready
        '503':
          description: Database unavailable
  /api/v1/goals:
    post:
      summary: Create a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalInput'
      responses:
        '201':
          description: Goal created
        '400':
          description: Validation error
    get:
      summary: List goals for the local owner
      responses:
        '200':
          description: Goal list
  /api/v1/goals/{id}:
    get:
      summary: Get a goal
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Goal found
        '404':
          description: Goal not found
    patch:
      summary: Update editable goal fields
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: '#/components/schemas/GoalPatch'
      responses:
        '200':
          description: Goal updated
        '400':
          description: Validation error
  /api/v1/goals/{id}/activate:
    post:
      summary: Activate a draft goal
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Goal activated
        '409':
          description: Invalid transition
  /api/v1/goals/{id}/evaluate:
    post:
      summary: Evaluate persisted Goal, Task, Evidence, and budget state
      description: Returns a persisted conservative evaluation. Free-form success criteria remain unknown until independently verified; this endpoint never completes a Goal.
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '201':
          description: Evaluation snapshot persisted
        '404':
          description: Goal not found
  /api/v1/goals/{id}/evaluations:
    get:
      summary: List recent persisted Goal evaluations
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Evaluation history
        '404':
          description: Goal not found
  /api/v1/goals/{id}/decisions:
    get:
      summary: List persisted Supervisor decisions for a Goal
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Decision history
        '404':
          description: Goal not found
  /api/v1/goals/{id}/plan:
    get:
      summary: Get the current committed Plan Version
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Current plan version
        '404':
          description: Goal or Plan not found
  /api/v1/goals/{id}/plan/proposals:
    get:
      summary: List persisted Plan Proposals
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Proposal history
  /api/v1/goals/{id}/replan:
    post:
      summary: Generate and persist a bounded Plan Proposal from the current Evaluation
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '201':
          description: Plan Proposal persisted but not committed
        '409':
          description: Current evaluation does not recommend replanning or plan version changed
  /api/v1/goals/{id}/plan-proposals/{proposalID}/accept:
    post:
      summary: Core-validate and atomically accept a Plan Proposal
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: proposalID
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: New Plan Version committed with Task additions
        '404':
          description: Goal or Proposal not found
        '409':
          description: Stale version conflict or expired proposal
  /api/v1/goals/{id}/plan-proposals/{proposalID}/reject:
    post:
      summary: Reject a pending Plan Proposal with an audit reason
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: proposalID
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 4000}
      responses:
        '200':
          description: Proposal rejected and decision audited
        '404':
          description: Goal or Proposal not found
  /api/v1/goals/{id}/pause:
    post:
      summary: Pause a goal
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Goal paused
  /api/v1/goals/{id}/resume:
    post:
      summary: Resume a paused goal
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Goal resumed
  /api/v1/goals/{id}/jobs:
    post:
      summary: Create or wake the persistent autonomous Goal Job
      description: Creates one durable background Job for this Goal or coalesces a wake signal into its existing Job. It does not execute the Supervisor turn in the HTTP request.
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '202':
          description: Goal Job queued or wake requested
        '404':
          description: Goal not found
        '409':
          description: Goal is not eligible for autonomous execution
    get:
      summary: List persistent Goal Job history
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Goal Job history
  /api/v1/goal-jobs/{jobID}:
    get:
      summary: Get a persistent Goal Job
      parameters:
        - name: jobID
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Goal Job state, lease, retry and run counters
        '404':
          description: Goal Job not found
  /api/v1/goal-jobs/{jobID}/pause:
    post:
      summary: Pause a Goal Job and fence any current Worker
      parameters:
        - name: jobID
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Goal Job paused
        '404':
          description: Goal Job not found
  /api/v1/goal-jobs/{jobID}/resume:
    post:
      summary: Resume a paused Goal Job
      parameters:
        - name: jobID
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Goal Job resumed
        '409':
          description: Goal Job is not paused or its Goal is not eligible
  /api/v1/goal-jobs/{jobID}/cancel:
    post:
      summary: Cancel a Goal Job and fence any current Worker
      parameters:
        - name: jobID
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Goal Job cancelled
        '404':
          description: Goal Job not found
  /api/v1/goals/{id}/sources:
    get:
      summary: List immutable source snapshots for a Goal
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Snapshot metadata and normalized content; raw bytes remain stored for re-verification
        '404':
          description: Goal not found
  /api/v1/goals/{id}/sources/{sourceID}:
    get:
      summary: Get an immutable source snapshot
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: sourceID
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Source snapshot
        '404':
          description: Goal or source snapshot not found
  /api/v1/goals/{id}/source-references:
    post:
      summary: Bind a report citation and exact quote to a source snapshot
      description: URL and quote are checked against the immutable snapshot. Semantic support remains unverified until independent review.
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, source_id, artifact_path, url, quote]
              properties:
                task_id: {type: string, format: uuid}
                source_id: {type: string, format: uuid}
                artifact_path: {type: string, maxLength: 1024}
                url: {type: string, format: uri}
                quote: {type: string, minLength: 1, maxLength: 8000}
      responses:
        '201':
          description: Immutable reference binding created with deterministic verification result
        '400':
          description: URL, quote, task, or artifact path does not match the snapshot
        '404':
          description: Goal, Task, or source snapshot not found
    get:
      summary: List citation bindings for an artifact
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: artifact_path
          in: query
          required: true
          schema: {type: string, maxLength: 1024}
      responses:
        '200':
          description: Persisted citation bindings
  /api/v1/goals/{id}/complete:
    post:
      summary: Complete a goal with verifiable evidence
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evidence]
              properties:
                evidence:
                  type: array
                  items:
                    type: object
                    required: [source, description]
                    properties:
                      source: {type: string}
                      description: {type: string}
                      reference: {type: string}
                      observed_at: {type: string, format: date-time}
      responses:
        '200':
          description: Goal completed
        '422':
          description: Evidence is missing or the current Evaluation does not satisfy every required structured criterion
  /api/v1/tasks:
    post:
      summary: Create a task attached to a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '201':
          description: Task created
        '400':
          description: Validation error
        '404':
          description: Goal not found
    get:
      summary: List tasks for a goal
      parameters:
        - name: goal_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task list
  /api/v1/tasks/{id}:
    get:
      summary: Get a task
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Task found
        '404':
          description: Task not found
  /api/v1/tasks/{id}/pause:
    post:
      summary: Pause a task
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Task paused
        '409':
          description: Invalid transition
  /api/v1/tasks/{id}/resume:
    post:
      summary: Resume a paused task
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Task resumed
  /api/v1/tasks/{id}/retry:
    post:
      summary: Mark a failed task ready for a bounded retry
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Task retry scheduled
        '409':
          description: Invalid transition or retry budget exhausted
  /api/v1/tasks/{id}/cancel:
    post:
      summary: Cancel a task
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Task cancelled
  /api/v1/planner/generate:
    post:
      summary: Generate a structured mock plan and persist its tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goal_id]
              properties:
                goal_id: {type: string, format: uuid}
      responses:
        '201':
          description: Structured plan and created tasks
        '404':
          description: Goal not found
  /api/v1/supervisor/turn:
    post:
      summary: Execute a bounded Mock-Agent turn for a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goal_id]
              properties:
                goal_id: {type: string, format: uuid}
      responses:
        '200':
          description: Goal, task, execution, and evidence state after the bounded turn
        '404':
          description: Goal not found
        '409':
          description: No runnable tasks
        '504':
          description: Execution budget expired
  /api/v1/supervisor/status:
    get:
      summary: Report local Supervisor readiness and registered agent count
      responses:
        '200':
          description: Supervisor status
  /api/v1/executions/{id}:
    get:
      summary: Get durable execution status and lease metadata
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Execution status
        '404':
          description: Execution not found for the local owner
  /api/v1/executions/{id}/cancel:
    post:
      summary: Request cooperative execution cancellation
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Queued execution cancelled
        '202':
          description: Running execution received a cancellation request; outcome may be uncertain
        '409':
          description: Execution is terminal or its outcome requires reconciliation
  /api/v1/approvals:
    post:
      summary: Request human approval for an exact tool action and parameter set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, tool_id, action, risk_level]
              properties:
                task_id: {type: string, format: uuid}
                tool_id: {type: string}
                action: {type: string}
                parameters: {type: object}
                risk_level: {type: integer, minimum: 0, maximum: 3}
                expires_in_seconds: {type: integer, minimum: 1, maximum: 86400, default: 900}
      responses:
        '201':
          description: Approval request created
    get:
      summary: List pending approvals
      responses:
        '200':
          description: Pending approvals
  /api/v1/approvals/{id}:
    get:
      summary: Get an approval request
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Approval request
  /api/v1/approvals/{id}/approve:
    post:
      summary: Approve the exact pending action
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Approval granted
        '409':
          description: Approval expired or already decided
  /api/v1/approvals/{id}/reject:
    post:
      summary: Reject the pending action
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Approval rejected
  /api/v1/agents:
    get:
      summary: List registered agent profiles
      responses:
        '200':
          description: Agent profiles
  /api/v1/agents/{id}:
    get:
      summary: Get an agent profile
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Agent profile
        '404':
          description: Agent not found
  /api/v1/tools:
    get:
      summary: List registered Tool metadata (registration does not grant permission)
      responses:
        '200':
          description: Tool metadata and operational state
  /api/v1/tools/{provider}/{tool}/{version}:
    get:
      summary: Get the exact registered Tool version and schema
      parameters:
        - name: provider
          in: path
          required: true
          schema: {type: string}
        - name: tool
          in: path
          required: true
          schema: {type: string}
        - name: version
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Exact Tool version metadata
        '404':
          description: Tool version not found
  /api/v1/mcp/servers:
    get:
      summary: List configured MCP server lifecycle/health state (credentials excluded)
      responses:
        '200':
          description: MCP server status list
  /api/v1/mcp/servers/{id}/enable:
    post:
      summary: Enable an operator-configured MCP server
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '202':
          description: Server connection scheduled
  /api/v1/mcp/servers/{id}/disable:
    post:
      summary: Disable an MCP server and its registered Tools
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '202':
          description: Server disabled
  /api/v1/mcp/servers/{id}/reconnect:
    post:
      summary: Reconnect and rediscover an enabled MCP server
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '202':
          description: Reconnection scheduled
  /api/v1/mcp/servers/{id}:
    delete:
      summary: Unregister an MCP server and disable its Tools until Core restart/config update
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Server removed from the current runtime
  /api/v1/nodes:
    get:
      summary: List registered nodes and current health state
      responses:
        '200':
          description: Node list
  /api/v1/nodes/register:
    post:
      summary: Register/update a node identity (registered nodes start offline)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity, name, type]
              properties:
                identity: {type: string}
                name: {type: string}
                type: {type: string, enum: [core, worker, vision, robot, home]}
                capabilities: {type: array, items: {type: string}}
      responses:
        '201':
          description: Node registered offline; a node heartbeat mechanism is not yet exposed
  /api/v1/nodes/{id}:
    get:
      summary: Get a registered node
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Node found
        '404':
          description: Node not found
  /api/v1/memories:
    post:
      summary: Create a provenance-aware memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryInput'
      responses:
        '201':
          description: Memory created
    get:
      summary: List memories for the local owner
      responses:
        '200':
          description: Memory list
  /api/v1/memories/{id}:
    get:
      summary: Get a memory
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Memory found
        '404':
          description: Memory not found
    patch:
      summary: Update memory fields
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryPatch'
      responses:
        '200':
          description: Memory updated
    delete:
      summary: Soft-delete a memory
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Memory deleted
  /api/v1/memories/search:
    post:
      summary: Keyword-search memories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: {type: string}
      responses:
        '200':
          description: Search results
  /api/v1/knowledge/documents:
    post:
      summary: Import and chunk text content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, source, content]
              properties:
                title: {type: string}
                source: {type: string}
                content: {type: string}
                metadata: {type: object}
      responses:
        '201':
          description: Document imported
        '409':
          description: Duplicate content
    get:
      summary: List imported knowledge documents
      responses:
        '200':
          description: Document list
  /api/v1/knowledge/search:
    post:
      summary: Search knowledge chunks and return citations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: {type: string}
      responses:
        '200':
          description: Cited search results
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    GoalInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {type: string, minLength: 1}
        description: {type: string}
        parent_goal_id: {type: [string, 'null'], format: uuid}
        priority: {type: integer, minimum: 1, maximum: 5, default: 3}
        success_criteria:
          type: array
          deprecated: true
          description: Legacy free-form criteria; retained for compatibility and cannot be verified automatically.
          items: {type: string}
        criteria:
          type: array
          description: User-confirmed structured acceptance criteria. At least one criterion must be required; cannot be combined with legacy success_criteria.
          items:
            $ref: '#/components/schemas/SuccessCriterion'
        constraints: {type: array, items: {type: string}}
    GoalPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: {type: string, minLength: 1}
        description: {type: string}
        priority: {type: integer, minimum: 1, maximum: 5}
        success_criteria:
          type: array
          deprecated: true
          description: Legacy free-form criteria; retained for compatibility and cannot be verified automatically.
          items: {type: string}
        criteria:
          type: array
          description: Replaces the structured acceptance criteria, clears legacy success_criteria, and increments versions for matching IDs. At least one criterion must be required.
          items:
            $ref: '#/components/schemas/SuccessCriterion'
        constraints: {type: array, items: {type: string}}
    SuccessCriterion:
      type: object
      additionalProperties: false
      required: [id, name, type, required, validation_method]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 4000}
        type:
          type: string
          enum: [verified_evidence_count, verified_task_completion, artifact_exists, markdown_structure]
        required: {type: boolean}
        validation_method:
          type: string
          enum: [verified_execution_evidence, artifact_in_file_storage]
        min_evidence: {type: integer, minimum: 1, maximum: 10000}
        evidence_sources:
          type: array
          items: {type: string, minLength: 1}
        require_reference: {type: boolean}
        task_ids:
          type: array
          maxItems: 200
          items: {type: string, minLength: 1}
        artifact_path:
          type: string
          maxLength: 1024
          description: Relative file path under FILE_STORAGE_DIR; absolute paths and traversal are rejected.
        required_sections:
          type: array
          maxItems: 32
          items: {type: string, minLength: 1}
        max_artifact_bytes: {type: integer, minimum: 1, maximum: 67108864}
        source:
          type: string
          readOnly: true
          description: Set by Core to user for API-provided criteria.
        confirmed:
          type: boolean
          readOnly: true
          description: Set by Core after the authenticated owner submits criteria.
        version:
          type: integer
          minimum: 1
          readOnly: true
          description: Managed by Core; increments when an existing criterion is revised.
        created_at:
          type: string
          format: date-time
          readOnly: true
    TaskInput:
      type: object
      additionalProperties: false
      required: [goal_id, title]
      properties:
        goal_id: {type: string, format: uuid}
        title: {type: string, minLength: 1}
        description: {type: string}
        priority: {type: integer, minimum: 1, maximum: 5, default: 3}
        success_criteria: {type: array, items: {type: string}}
        criterion_ids:
          type: array
          description: Unique Criterion IDs declared by the referenced Goal; Core rejects unknown or duplicate IDs.
          items: {type: string, minLength: 1, maxLength: 128}
    MemoryInput:
      type: object
      additionalProperties: false
      required: [category, content, source]
      properties:
        category: {type: string, enum: [fact, preference, experience, relationship, event, instruction]}
        content: {type: string, minLength: 1}
        source: {type: string, minLength: 1}
        confidence: {type: number, minimum: 0, maximum: 1}
        observed_at: {type: string, format: date-time}
        metadata: {type: object}
    MemoryPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        category: {type: string, enum: [fact, preference, experience, relationship, event, instruction]}
        content: {type: string, minLength: 1}
        source: {type: string, minLength: 1}
        confidence: {type: number, minimum: 0, maximum: 1}
