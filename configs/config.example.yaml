# Reference template only; the runtime currently reads environment variables.
# 仅供参考的配置模板；程序当前从环境变量读取运行配置。
app:
  environment: development
  host: 127.0.0.1
  port: "8080"
  log_level: info

database:
  url: postgres://paios:${POSTGRES_PASSWORD}@localhost:5432/paios?sslmode=disable

security:
  # Set PAIOS_API_KEY through the environment; never commit a real key.
  # 通过环境变量设置 PAIOS_API_KEY；切勿将真实密钥提交到仓库。
  api_key_env: PAIOS_API_KEY

model:
  # Supported providers: mock, openai-compatible, ollama.
  # 支持的 Provider：mock、openai-compatible、ollama。
  provider: mock
  base_url: ""
  api_key_env: MODEL_API_KEY
  name: mock
  ollama_base_url: http://localhost:11434

storage:
  # Native file Tools and Core Artifact verification use this trusted directory.
  # 原生文件 Tool 和 Core Artifact 验证使用此可信目录。
  data_dir: ./data
  file_storage_dir: ./data/files
  report_export_dir: "" # Optional distinct directory; report.export requires approval

tools:
  # Exact host allowlist; empty disables http.fetch. Wildcards are not supported.
  # 精确主机 allowlist；留空时禁用 http.fetch，不支持通配符。
  http_fetch_allowed_hosts: []

mcp:
  # Runtime reads MCP_SERVERS_JSON only. Configure exact HTTPS endpoint/host allowlist,
  # or an absolute stdio command plus argv, working directory, and explicit env map.
  # 运行时仅读取 MCP_SERVERS_JSON。HTTP 仅配精确 HTTPS endpoint/主机白名单；
  # stdio 必须指定绝对命令、独立 argv、工作目录和明确环境变量。
  servers_env: MCP_SERVERS_JSON

execution:
  max_agent_steps: 12
  max_model_calls: 8
  max_model_tokens: 64000
  max_tool_calls: 20
  max_execution_seconds: 300
  max_execution_cost: 0
  max_retries: 3

# Durable execution worker settings; runtime reads equivalent environment variables.
# 持久化执行 Worker 配置；运行时读取对应的环境变量。
workers:
  id: paios
  count: 2
  lease_seconds: 30
  heartbeat_seconds: 10
  poll_milliseconds: 500
  recovery_seconds: 5
  shutdown_grace_seconds: 15
  # Automatic replay of uncertain in-flight results requires an Agent-level idempotency declaration.
  # 运行中结果不确定时，只有 Agent 级幂等声明才允许自动重放。
  idempotency_policy: agent-declared-only
